services:

  db:
    image: postgres:16
    container_name: recom_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: Recom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5434:5432"


  web:
    build: .
    container_name: recom_web

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/code

    ports:
      - "8000:8000"

    depends_on:
      - db

    environment:
      POSTGRES_DB: Recom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432


volumes:
  postgres_data: