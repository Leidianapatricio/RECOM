{% load static %}
{% load i18n %}

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">

        <a
            class="navbar-brand"
            href="{% url 'core:home' %}"
        >
           <img
                src="{% static 'img/logo_recom.png' %}"
                alt="Logo da RECOM"
                class="logo-recom"
                width="65"
                height="65"
            >
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuNavbar"
            aria-controls="menuNavbar"
            aria-expanded="false"
            aria-label="Abrir menu"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            id="menuNavbar"
        >

            <ul class="navbar-nav ms-auto fw-semibold align-items-lg-center">

                <!-- Início -->
                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="{% url 'core:home' %}"
                    >
                        <i class="bi bi-house-door me-1"></i>
                        Início
                    </a>
                </li>

                <!-- Escolas -->
                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="{% url 'escolas:listar_escolas' %}"
                    >
                        <i class="bi bi-building me-1"></i>
                        Escolas
                    </a>
                </li>

                <!-- Visitas -->
                <li class="nav-item">
                    <a
                        class="nav-link disabled"
                        href="#"
                        tabindex="-1"
                        aria-disabled="true"
                        title="Funcionalidade em desenvolvimento"
                    >
                        <i class="bi bi-clipboard-check me-1"></i>
                        Visitas
                    </a>
                </li>

                <!-- Ocorrências -->
                <li class="nav-item">
                    <a
                        class="nav-link disabled"
                        href="#"
                        tabindex="-1"
                        aria-disabled="true"
                        title="Funcionalidade em desenvolvimento"
                    >
                        <i class="bi bi-exclamation-triangle me-1"></i>
                        Ocorrências
                    </a>
                </li>

                <!-- Ações -->
                <li class="nav-item">
                    <a
                        class="nav-link disabled"
                        href="#"
                        tabindex="-1"
                        aria-disabled="true"
                        title="Funcionalidade em desenvolvimento"
                    >
                        <i class="bi bi-people me-1"></i>
                        Ações
                    </a>
                </li>

                <!-- Idioma -->
                <li class="nav-item ms-lg-3">

                    <form
                        action="{% url 'set_language' %}"
                        method="post"
                    >
                        {% csrf_token %}

                        <input
                            type="hidden"
                            name="next"
                            value="{{ request.path }}"
                        >

                        <select
                            name="language"
                            class="form-select form-select-sm"
                            onchange="this.form.submit()"
                            aria-label="Selecionar idioma"
                        >

                            <option
                                value="pt-br"
                                {% if LANGUAGE_CODE == "pt-br" %}
                                    selected
                                {% endif %}
                            >
                                PT
                            </option>

                            <option
                                value="en"
                                {% if LANGUAGE_CODE == "en" %}
                                    selected
                                {% endif %}
                            >
                                EN
                            </option>

                        </select>

                    </form>

                </li>

            </ul>

        </div>

    </div>
</nav>
