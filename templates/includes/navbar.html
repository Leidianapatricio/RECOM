{% load static %}
{% load i18n %}

<nav class="navbar navbar-expand-lg navbar-recom shadow-sm">

    <div class="container">

        <!-- MARCA RECOM -->
        <a
            class="navbar-brand navbar-brand-recom"
            href="{% url 'core:home' %}"
        >

            <img
                src="{% static 'img/logo_recom.png' %}?v=3"
                alt="Logo da RECOM"
                class="logo-recom"
                width="95"
                height="95"
            >

            <div class="navbar-brand-text d-none d-md-block">

                <span class="navbar-recom-title">
                    RECOM
                </span>

                <span class="navbar-recom-subtitle">
                    {% trans "Ronda Escolar Comunitária" %}
                </span>

            </div>

        </a>


        <!-- BOTÃO MOBILE -->
        <button
            class="navbar-toggler navbar-toggler-recom"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuNavbar"
            aria-controls="menuNavbar"
            aria-expanded="false"
            aria-label="Abrir menu"
        >
            <i class="bi bi-list"></i>
        </button>


        <!-- MENU -->
        <div
            class="collapse navbar-collapse"
            id="menuNavbar"
        >

            <ul class="navbar-nav ms-auto fw-semibold align-items-lg-center navbar-menu-recom">

                <!-- INÍCIO -->
                <li class="nav-item">

                    <a
                        class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
                        href="{% url 'core:home' %}"
                    >
                        <i class="bi bi-house-door-fill me-1"></i>
                        {% trans "Início" %}
                    </a>

                </li>


                <!-- ESCOLAS -->
                <li class="nav-item">

                    <a
                        class="nav-link {% if request.resolver_match.app_name == 'escolas' %}active{% endif %}"
                        href="{% url 'escolas:listar_escolas' %}"
                    >
                        <i class="bi bi-building me-1"></i>
                        {% trans "Escolas" %}
                    </a>

                </li>


                <!-- VISITAS -->
                <li class="nav-item">

                    <a
                        class="nav-link {% if request.resolver_match.app_name == 'visitas' %}active{% endif %}"
                        href="{% url 'visitas:cadastrar_visita' %}"
                    >
                        <i class="bi bi-clipboard-check me-1"></i>
                        {% trans "Visitas" %}
                    </a>

                </li>


                <!-- RELATÓRIOS -->
                <li class="nav-item">

                    <a
                        class="nav-link {% if request.resolver_match.url_name == 'relatorios' or request.resolver_match.url_name == 'relatorio_problematicas' or request.resolver_match.url_name == 'relatorio_visitas' %}active{% endif %}"
                        href="{% url 'core:relatorios' %}"
                    >
                        <i class="bi bi-bar-chart-line-fill me-1"></i>
                        {% trans "Relatórios" %}
                    </a>

                </li>


                <!-- COORDENADOR -->
                <li class="nav-item">

                    <a
                        class="nav-link {% if request.resolver_match.url_name == 'dashboard_coordenador' %}active{% endif %}"
                        href="{% url 'core:dashboard_coordenador' %}"
                    >
                        <i class="bi bi-speedometer2 me-1"></i>
                        {% trans "Coordenador" %}
                    </a>

                </li>


                <!-- OCORRÊNCIAS -->
                <li class="nav-item">

                    <a
                        class="nav-link disabled"
                        href="#"
                        tabindex="-1"
                        aria-disabled="true"
                        title="Funcionalidade em desenvolvimento"
                    >
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        {% trans "Ocorrências" %}
                    </a>

                </li>


                <!-- AÇÕES -->
                <li class="nav-item">

                    <a
                        class="nav-link disabled"
                        href="#"
                        tabindex="-1"
                        aria-disabled="true"
                        title="Funcionalidade em desenvolvimento"
                    >
                        <i class="bi bi-people-fill me-1"></i>
                        {% trans "Ações" %}
                    </a>

                </li>


                <!-- IDIOMA -->
                <li class="nav-item ms-lg-3 navbar-language">

                    <form
                        action="{% url 'set_language' %}"
                        method="post"
                    >

                        {% csrf_token %}

                        <input
                            type="hidden"
                            name="next"
                            value="{{ request.path }}"
                        >

                        <select
                            name="language"
                            class="form-select form-select-sm language-select"
                            onchange="this.form.submit()"
                            aria-label="Selecionar idioma"
                        >

                            <option
                                value="pt-br"
                                {% if LANGUAGE_CODE == "pt-br" %}
                                    selected
                                {% endif %}
                            >
                                PT
                            </option>

                            <option
                                value="en"
                                {% if LANGUAGE_CODE == "en" %}
                                    selected
                                {% endif %}
                            >
                                EN
                            </option>

                        </select>

                    </form>

                </li>

            </ul>

        </div>

    </div>

</nav>
